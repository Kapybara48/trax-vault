services:
  trax-vault:
    image: git.kapyhub.cz/kapybara/trax-vault:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trax-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - MUSIC_DIR=/music
      # Automatically syncs newly placed albums from disk on startup (set to false to manage manually via /scan)
      - AUTO_SYNC_LIBRARY=true
      # Set to your server URL or domain (e.g. http://my-server.lan:3000 or http://localhost:3000)
      - ORIGIN=http://localhost:3000
    volumes:
      - ./data:/app/data
      # Mount your existing music library folder here (read-write for companion lyrics files and tagger)
      - ${MUSIC_PATH:-./music}:/music
