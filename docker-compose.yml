services:
  trax-vault:
    image: git.kapyhub.cz/kapybara/trax-vault:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trax-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - MUSIC_DIR=/music
      # Set to true if you want Trax Vault to automatically import all albums found in /music into the Vault on startup
      # Default is false so you can preview, tag, and import albums manually via /scan
      - AUTO_SYNC_LIBRARY=false
      # Set to your server URL or domain (e.g. http://my-server.lan:3000 or http://localhost:3000)
      - ORIGIN=http://localhost:3000
      # Unlimited body size to support high-fidelity and multi-gigabyte audio uploads
      - BODY_SIZE_LIMIT=Infinity
    volumes:
      - ./data:/app/data
      # Mount your existing music library folder here (read-write for companion lyrics files and tagger)
      - ${MUSIC_PATH:-./music}:/music
