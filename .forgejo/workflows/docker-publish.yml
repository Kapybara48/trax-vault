name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: forgejo.kapyhub.cz
  IMAGE_NAME: kapybara/trax-vault

jobs:
  build-and-push:
    name: Build & Push Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Docker CLI is available
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker CLI..."
            apt-get update && apt-get install -y --no-install-recommends docker.io || true
          fi
          docker version

      - name: Log in to Forgejo Container Registry
        run: |
          AUTH_TOKEN="${{ secrets.PACKAGE_TOKEN || secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}"
          AUTH_USER="${{ secrets.REGISTRY_USER || github.actor }}"
          echo "$AUTH_TOKEN" | docker login ${{ env.REGISTRY }} -u "$AUTH_USER" --password-stdin

      - name: Build & Push Docker image
        run: |
          COMMIT_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          export DOCKER_BUILDKIT=1

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # =========================================================================
            # TAG WORKFLOW: Canonical primary release builder
            # =========================================================================
            RAW_TAG="${{ github.ref_name }}"
            APP_VERSION="${RAW_TAG#v}"
            echo "Building canonical release image for tag: ${RAW_TAG} (App Version: ${APP_VERSION}, Commit: ${{ github.sha }})"

            # Pull latest for layer cache if available
            docker pull "${LATEST_IMAGE}" >/dev/null 2>&1 || true

            TAG_ARGS="-t ${LATEST_IMAGE} -t ${COMMIT_IMAGE} -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${RAW_TAG} -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${APP_VERSION}"

            echo "Building Trax Vault Docker image with layer cache..."
            docker build \
              --cache-from "${LATEST_IMAGE}" \
              --build-arg APP_VERSION="${APP_VERSION}" \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              $TAG_ARGS \
              -f Dockerfile .

            echo "Pushing release images to registry..."
            docker push "${LATEST_IMAGE}"
            docker push "${COMMIT_IMAGE}"
            docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${RAW_TAG}"
            docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${APP_VERSION}"
            echo "Release build and publish complete."
            exit 0

          else
            # =========================================================================
            # MAIN BRANCH WORKFLOW: Reuse existing image or yield to tag builder
            # =========================================================================
            echo "Running on branch '${{ github.ref_name }}' for commit ${{ github.sha }}."

            # Ensure tags are fetched
            git fetch --tags --force origin 2>/dev/null || true
            MATCHING_TAG=$(git tag --points-at ${{ github.sha }} 2>/dev/null | grep '^v' | head -n 1 || true)

            # 1. Quick check: is the commit image already in the registry (built by tag)?
            if docker pull "${COMMIT_IMAGE}" >/dev/null 2>&1; then
              echo "Commit image ${COMMIT_IMAGE} was already built by tag! Reusing image without rebuilding..."
              docker tag "${COMMIT_IMAGE}" "${LATEST_IMAGE}"
              docker push "${LATEST_IMAGE}"
              echo "Successfully copied image to :latest in ~3s."
              exit 0
            fi

            # 2. If this commit has a matching version tag but image isn't in registry yet,
            # YIELD IMMEDIATELY so we do not block the sequential runner from running the tag job!
            if [ -n "${MATCHING_TAG}" ]; then
              echo "Commit ${{ github.sha }} has release tag ${MATCHING_TAG}."
              echo "Yielding runner immediately so the tag workflow can build and publish the release image."
              exit 0
            fi

            # 3. Untagged branch build (normal development push on main)
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.7.1")
            APP_VERSION="${LATEST_TAG#v}"
            echo "Building untagged branch image (App Version: ${APP_VERSION})..."

            docker pull "${LATEST_IMAGE}" >/dev/null 2>&1 || true

            docker build \
              --cache-from "${LATEST_IMAGE}" \
              --build-arg APP_VERSION="${APP_VERSION}" \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t "${LATEST_IMAGE}" \
              -t "${COMMIT_IMAGE}" \
              -f Dockerfile .

            docker push "${LATEST_IMAGE}"
            docker push "${COMMIT_IMAGE}"
            echo "Branch build and publish complete."
          fi
