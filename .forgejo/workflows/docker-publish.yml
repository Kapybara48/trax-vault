name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: forgejo.kapyhub.cz
  IMAGE_NAME: kapybara/trax-vault

jobs:
  build-and-push:
    name: Build & Push Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Docker CLI is available
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker CLI..."
            apt-get update && apt-get install -y --no-install-recommends docker.io || true
          fi
          docker version

      - name: Log in to Forgejo Container Registry
        run: |
          AUTH_TOKEN="${{ secrets.PACKAGE_TOKEN || secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}"
          AUTH_USER="${{ secrets.REGISTRY_USER || github.actor }}"
          echo "$AUTH_TOKEN" | docker login ${{ env.REGISTRY }} -u "$AUTH_USER" --password-stdin

      - name: Build & Push Docker image
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW_TAG="${{ github.ref_name }}"
            APP_VERSION="${RAW_TAG#v}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.7.1")
            APP_VERSION="${LATEST_TAG#v}"
          fi
          echo "Building Trax Vault version: ${APP_VERSION}"

          TAG_ARGS="-t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_ARGS="$TAG_ARGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${APP_VERSION}"
          fi

          docker build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            $TAG_ARGS \
            -f Dockerfile .

          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${APP_VERSION}
          fi
