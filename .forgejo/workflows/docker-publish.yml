name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'docker-compose.server.yml'
      - '.env.example'
      - 'LICENSE*'
      - '.vscode/**'
      - '.idea/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: git.kapyhub.cz
  IMAGE_NAME: kapybara/trax-vault
  DOCKER_HOST: tcp://172.21.0.2:2375

jobs:
  build-and-push:
    name: Build & Push Container
    runs-on: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker daemon connection
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker CLI..."
            apt-get update && apt-get install -y --no-install-recommends docker.io || true
          fi

          echo "Detecting Docker daemon connection..."
          DETECTED=""
          for candidate in "${DOCKER_HOST:-}" "tcp://172.21.0.2:2375" "tcp://docker-in-docker:2375" "tcp://docker:2375" "unix:///var/run/docker.sock"; do
            echo "Checking: $candidate"
            if [ -n "$candidate" ] && DOCKER_HOST="$candidate" docker info >/dev/null 2>&1; then
              DETECTED="$candidate"
              echo "==> Successfully connected to Docker daemon at $candidate"
              break
            fi
          done

          if [ -n "$DETECTED" ]; then
            echo "DOCKER_HOST=$DETECTED" >> $GITHUB_ENV
            export DOCKER_HOST="$DETECTED"
            docker version
          else
            echo "::error::Could not connect to Docker daemon. Probing candidates:"
            for candidate in "tcp://172.21.0.2:2375" "tcp://docker-in-docker:2375" "tcp://docker:2375" "unix:///var/run/docker.sock"; do
              echo "--- Probing candidate: $candidate ---"
              DOCKER_HOST="$candidate" docker info || true
            done
            exit 1
          fi

      - name: Log in to Forgejo Container Registry
        run: |
          AUTH_TOKEN="${{ secrets.PACKAGE_TOKEN || secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}"
          AUTH_USER="${{ secrets.REGISTRY_USER || github.actor }}"
          echo "$AUTH_TOKEN" | docker login ${{ env.REGISTRY }} -u "$AUTH_USER" --password-stdin

      - name: Build Docker image
        run: |
          TAG_ARGS="-t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_ARGS="$TAG_ARGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          fi
          docker build $TAG_ARGS -f Dockerfile .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          fi
