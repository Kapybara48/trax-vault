name: Build and Publish Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: forgejo.kapyhub.cz
  BUILDER_IMAGE: kapybara/trax-vault-android-builder

jobs:
  build-and-release-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Docker CLI is available & Check Disk Space
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker CLI..."
            apt-get update && apt-get install -y --no-install-recommends docker.io curl jq || true
          fi
          docker version
          echo "Disk space before build:"
          df -h
          docker container prune -f || true
          docker image prune -f || true
          AVAIL_KB=$(df --output=avail / 2>/dev/null | tail -n 1 || echo 9999999)
          if [ "${AVAIL_KB}" -lt 3000000 ] 2>/dev/null; then
            echo "Disk space is low (${AVAIL_KB} KB). Safely pruning old builder cache..."
            docker builder prune -f --keep-storage 2GB || true
          fi
          echo "Disk space ready:"
          df -h

      - name: Log in to Forgejo Container Registry
        run: |
          AUTH_TOKEN="${{ secrets.PACKAGE_TOKEN || secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}"
          AUTH_USER="${{ secrets.REGISTRY_USER || github.actor }}"
          echo "$AUTH_TOKEN" | docker login ${{ env.REGISTRY }} -u "$AUTH_USER" --password-stdin

      - name: Build Android APK with Local Registry Cache
        run: |
          BUILDER_TAG="${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE }}:latest"
          export DOCKER_BUILDKIT=1

          echo "Pulling cached builder from local registry: ${BUILDER_TAG}..."
          docker pull "${BUILDER_TAG}" 2>/dev/null || true

          echo "Compiling Android APK with Docker BuildKit..."
          docker build \
            --cache-from "${BUILDER_TAG}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "${BUILDER_TAG}" \
            -f android/Dockerfile.build android

          echo "Extracting compiled APK from Docker image..."
          CONTAINER_ID=$(docker create "${BUILDER_TAG}")
          docker cp "${CONTAINER_ID}:/app/app/build/outputs/apk/debug/app-debug.apk" trax-vault.apk
          docker rm "${CONTAINER_ID}" >/dev/null

          echo "Pushing updated builder cache to local Forgejo registry..."
          docker push "${BUILDER_TAG}" 2>/dev/null || true

          echo "APK generated successfully:"
          ls -lh trax-vault.apk

      - name: Publish APK to Forgejo Release
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            RAW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.7.53")
          fi

          echo "Publishing trax-vault.apk to Forgejo Release for tag: ${RAW_TAG}"

          AUTH_HEADER="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          BASE_URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"

          # 1. Check if release already exists for this tag
          HTTP_STATUS=$(curl -s -o /tmp/release_resp.json -w "%{http_code}" -H "${AUTH_HEADER}" "${BASE_URL}/releases/tags/${RAW_TAG}")
          RELEASE_ID=""

          if [ "$HTTP_STATUS" -eq 200 ]; then
            RELEASE_ID=$(jq -r '.id // empty' /tmp/release_resp.json)
            echo "Found existing release with ID: ${RELEASE_ID}"
          else
            echo "Release for tag ${RAW_TAG} does not exist yet. Creating release..."
            CREATE_PAYLOAD=$(jq -n \
              --arg tag "${RAW_TAG}" \
              --arg name "Trax Vault ${RAW_TAG}" \
              --arg body "### Trax Vault ${RAW_TAG} Android Release\n\nDownload \`trax-vault.apk\` below to install Trax Vault directly on your Android phone." \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')

            CREATE_STATUS=$(curl -s -o /tmp/create_resp.json -w "%{http_code}" \
              -X POST \
              -H "${AUTH_HEADER}" \
              -H "Content-Type: application/json" \
              -d "${CREATE_PAYLOAD}" \
              "${BASE_URL}/releases")

            if [ "$CREATE_STATUS" -ge 200 ] && [ "$CREATE_STATUS" -lt 300 ]; then
              RELEASE_ID=$(jq -r '.id // empty' /tmp/create_resp.json)
              echo "Created new release with ID: ${RELEASE_ID}"
            else
              echo "Failed to create release. HTTP ${CREATE_STATUS}"
              cat /tmp/create_resp.json
              exit 1
            fi
          fi

          if [ -z "${RELEASE_ID}" ] || [ "${RELEASE_ID}" = "null" ]; then
            echo "ERROR: Invalid Release ID: ${RELEASE_ID}"
            exit 1
          fi

          # 2. Check if trax-vault.apk asset already exists on the release; if so, remove it to overwrite
          ASSETS_RESP=$(curl -s -H "${AUTH_HEADER}" "${BASE_URL}/releases/${RELEASE_ID}/assets")
          EXISTING_ASSET_ID=$(echo "${ASSETS_RESP}" | jq -r '.[] | select(.name == "trax-vault.apk") | .id' 2>/dev/null || true)

          if [ -n "${EXISTING_ASSET_ID}" ] && [ "${EXISTING_ASSET_ID}" != "null" ]; then
            echo "Existing asset trax-vault.apk found (ID: ${EXISTING_ASSET_ID}). Deleting old asset..."
            curl -s -X DELETE -H "${AUTH_HEADER}" "${BASE_URL}/releases/${RELEASE_ID}/assets/${EXISTING_ASSET_ID}"
          fi

          # 3. Upload new trax-vault.apk
          echo "Uploading trax-vault.apk to release ${RELEASE_ID}..."
          UPLOAD_STATUS=$(curl -s -o /tmp/upload_resp.json -w "%{http_code}" \
            -X POST \
            -H "${AUTH_HEADER}" \
            -H "Content-Type: multipart/form-data" \
            -F "attachment=@trax-vault.apk;filename=trax-vault.apk" \
            "${BASE_URL}/releases/${RELEASE_ID}/assets?name=trax-vault.apk")

          if [ "$UPLOAD_STATUS" -ge 200 ] && [ "$UPLOAD_STATUS" -lt 300 ]; then
            echo "SUCCESS: trax-vault.apk published to release ${RAW_TAG} successfully!"
          else
            echo "ERROR: Failed to upload trax-vault.apk. HTTP status: ${UPLOAD_STATUS}"
            cat /tmp/upload_resp.json
            exit 1
          fi
